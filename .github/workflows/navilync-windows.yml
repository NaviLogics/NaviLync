name: NaviLync Windows x64

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Upload the portable EXE to the matching existing release (v<package version>)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: yarn install --network-timeout 600000
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Unit tests
        run: yarn test:unit --run
      - name: Build
        run: yarn build

  windows-x64:
    name: Windows x64
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: yarn install --network-timeout 600000
      - name: Build renderer and Electron entrypoints
        run: yarn build
      - name: Build NaviLync unpacked directory
        run: yarn deploy:electron:windows:dir
      - name: Package Windows x64 directory
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $source = "dist/win-unpacked"
          $archive = "dist/NaviLync-$version-windows-x64.zip"
          if (-not (Test-Path "$source/NaviLync.exe")) {
            Get-ChildItem dist | Select-Object Name, Length
            throw "Expected unpacked NaviLync.exe was not produced."
          }
          Compress-Archive -Path "$source/*" -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive)) {
            throw "Failed to package Windows x64 directory: $archive"
          }
      - name: Upload NaviLync Windows x64 directory package
        uses: actions/upload-artifact@v4
        with:
          name: NaviLync-Windows-x64
          path: dist/NaviLync-*-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
          $asset = "dist/NaviLync-$version-windows-x64.zip"
          # Do not use the native PowerShell success status of `gh release view` here:
          # redirecting native command output can leave the condition unreliable on Windows runners.
          # Query the release explicitly and branch on the process exit code instead.
          gh release view $tag --json tagName 1>$null 2>$null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title "NaviLync $version" --generate-notes --verify-tag
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish NaviLync $version release asset."
          }
