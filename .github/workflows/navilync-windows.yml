name: NaviLync Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: yarn install --network-timeout 600000
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Unit tests
        run: yarn test:unit --run
      - name: Build
        run: yarn build

  windows-x64:
    name: Windows x64
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: yarn install --network-timeout 600000
      - name: Build renderer and Electron entrypoints
        run: yarn build
      - name: Build NaviLync portable
        run: yarn deploy:electron:windows:portable
      - name: Verify exact portable executable
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expected = "dist/NaviLync-$version-portable-x64.exe"
          if (-not (Test-Path $expected)) {
            Get-ChildItem dist | Select-Object Name, Length
            throw "Expected portable executable was not produced: $expected"
          }
      - name: Upload NaviLync Windows x64 portable
        uses: actions/upload-artifact@v4
        with:
          name: NaviLync-Windows-x64
          path: dist/NaviLync-*-portable-x64.exe
          if-no-files-found: error
