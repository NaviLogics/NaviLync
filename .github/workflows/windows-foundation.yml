name: Windows Foundation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/windows-foundation

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:ci

      - name: Web/Electron build
        run: yarn build

  windows-package:
    name: Windows x64 package
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build renderer and Electron entrypoints
        run: yarn build

      - name: Build NSIS installer
        run: yarn deploy:electron:windows

      - name: Verify NaviLync installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'NaviLync-win-x64-*.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'NaviLync Windows installer was not produced.'
          }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NaviLync-Windows-x64
          path: dist/NaviLync-win-x64-*.exe
          if-no-files-found: error
