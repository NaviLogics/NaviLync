name: Import Cockpit v1.18.4

on:
  push:
    branches:
      - bootstrap/cockpit-v1.18.4-import

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import exact Cockpit v1.18.4 commit
        shell: bash
        run: |
          set -euo pipefail
          git remote add cockpit-upstream https://github.com/bluerobotics/cockpit.git
          git fetch --no-tags cockpit-upstream refs/tags/v1.18.4
          test "$(git rev-parse FETCH_HEAD)" = "48ccf4af021d90456c67844272d4817975ea5f0d"
          git push origin FETCH_HEAD:refs/heads/upstream/cockpit-v1.18.4 --force
