name: Import Cockpit v1.18.4

on:
  push:
    branches:
      - bootstrap/cockpit-v1.18.4-import

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import Cockpit v1.18.4 tree without workflow files
        shell: bash
        run: |
          set -euo pipefail
          git remote add cockpit-upstream https://github.com/bluerobotics/cockpit.git
          git fetch --no-tags cockpit-upstream refs/tags/v1.18.4
          test "$(git rev-parse FETCH_HEAD)" = "48ccf4af021d90456c67844272d4817975ea5f0d"
          git checkout --detach FETCH_HEAD
          rm -rf .github/workflows
          git add -A
          git config user.name "NaviLogics Import Bot"\n          git config user.email "132571220+NaviLogics@users.noreply.github.com"\n          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Import Cockpit v1.18.4 base tree' | git commit-tree "$tree")"
          git push origin "$commit":refs/heads/upstream/cockpit-v1.18.4 --force
