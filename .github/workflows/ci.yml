name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  NODE_OPTIONS: --max-old-space-size=6144

concurrency:
  group: navilync-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Lint
        run: yarn lint

      - name: TypeScript resolution diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          node -e 'const p=require.resolve("typescript/package.json");console.log("root_ts", require(p).version, p)'
          node -e 'const b=require.resolve("vue-tsc/package.json");const p=require.resolve("typescript/package.json",{paths:[b]});console.log("vue_tsc_ts", require(p).version, p)'
          node -e 'console.log("vue_tsc", require("vue-tsc/package.json").version)'
          yarn why typescript
          yarn why @volar/typescript
          yarn why @vue/language-core
          ls node_modules/typescript/package.json node_modules/vue-tsc/node_modules/typescript/package.json 2>&1
          npx tsc --version
          npx tsc --noEmit -p tsconfig.vitest.json --composite false 2>&1 | tee /tmp/plain-tsc.log | tail -40
          PLAIN_TSC_EXIT=${PIPESTATUS[0]}
          echo "plain_tsc_canary_matches:"
          grep -E 'T0_(TYPECHECK|PROD_TYPECHECK)_CANARY|px4-mission-regressions\.test\.ts|src/libs/utils\.ts' /tmp/plain-tsc.log || true
          echo "plain_tsc_exit=${PLAIN_TSC_EXIT}"
          exit 0

      - name: Typecheck
        if: always()
        run: yarn typecheck --listFiles

      - name: Unit tests
        if: always()
        run: yarn test:unit --run

      - name: Build
        run: yarn build
