name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  NODE_OPTIONS: --max-old-space-size=6144

concurrency:
  group: navilync-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Lint
        run: yarn lint

      - name: Typecheck
        if: always()
        shell: bash
        run: |
          set +e
          yarn typecheck --listFiles 2>&1 | tee /tmp/typecheck-canary.log
          TYPECHECK_EXIT=${PIPESTATUS[0]}
          echo "=== TYPECHECK CANARY DIAGNOSTICS ==="
          echo "typecheck_exit=${TYPECHECK_EXIT}"
          echo "src_file_count=$(grep -c '/src/' /tmp/typecheck-canary.log || true)"
          echo "px4_mission_matches:"
          grep 'px4-mission' /tmp/typecheck-canary.log || true
          echo "typescript_errors:"
          grep 'error TS' /tmp/typecheck-canary.log || true
          exit ${TYPECHECK_EXIT}

      - name: Unit tests
        if: always()
        run: yarn test:unit --run

      - name: Build
        run: yarn build
